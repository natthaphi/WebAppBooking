<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dashboard | Tattoo Booking</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --main-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --primary-soft: rgba(99, 102, 241, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            color: var(--text-dark);
        }

        .fw-800 { font-weight: 800; }
        .fw-600 { font-weight: 600; }

        .btn-grad {
            background: var(--main-grad);
            color: white; border: none; padding: 12px 25px;
            border-radius: 15px; transition: all 0.3s ease; font-weight: 600;
        }
        .btn-grad:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); color: white; }

        .stat-pill {
            background: white; padding: 25px; border-radius: 24px;
            border: 1px solid #f1f5f9; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: transform 0.3s ease;
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); overflow: hidden;
        }

        .custom-table thead th {
            color: var(--text-muted); font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 1px; padding: 20px;
        }

        .badge-glass {
            padding: 8px 15px; border-radius: 12px; font-size: 0.8rem;
            font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
        }
        .st-confirm { background: #dcfce7; color: #166534; }
        .st-pending { background: #fef9c3; color: #854d0e; }

        .floating-nav {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            padding: 12px 30px; border-radius: 50px; display: flex; gap: 30px;
            z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .floating-nav a { color: #94a3b8; font-size: 1.3rem; transition: 0.3s; }
        .floating-nav a.active { color: #818cf8; }

        .btn-action {
            width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 12px; border: none; transition: 0.3s; background: white; shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-action:disabled { opacity: 0.2; cursor: not-allowed; filter: grayscale(1); }

        .creator-tag { font-size: 0.65rem; color: #94a3b8; margin-top: 4px; display: block; }
    </style>
</head>
<body>

    <header class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
            <div class="animate__animated animate__fadeInLeft">
                <h1 class="fw-800 display-5 mb-0" style="background: var(--main-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">BOOKING TATTOO</h1>
                <p class="text-muted fw-600">สวัสดีคุณ <span id="displayUser" class="text-primary">ผู้ใช้งาน</span> 👋</p>
            </div>
            <button class="btn btn-grad shadow-lg animate__animated animate__fadeInRight" onclick="openAddModal()">
                <i class="fas fa-plus-circle me-2"></i> สร้างรายการจองใหม่
            </button>
        </div>
    </header>

    <main class="container mb-5 pb-5">
        <div class="row g-4 mb-5 animate__animated animate__fadeInUp">
            <div class="col-6 col-md-3">
                <div class="stat-pill">
                    <div class="small text-muted mb-1">คิวทั้งหมด</div>
                    <div class="h3 fw-800 m-0" id="totalQueue">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-pill">
                    <div class="small text-muted mb-1">คิวของฉัน</div>
                    <div class="h3 fw-800 m-0 text-primary" id="myQueueCount">0</div>
                </div>
            </div>
        </div>

        <div class="glass-panel p-4 animate__animated animate__fadeInUp">
            <div class="table-responsive">
                <table class="custom-table align-middle w-100" id="bookingTable">
                    <thead>
                        <tr>
                            <th width="20%">วันเวลา</th>
                            <th width="35%">รายละเอียดลูกค้า</th>
                            <th width="20%">สถานะ</th>
                            <th width="25%" class="text-center">การจัดการ</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <nav class="floating-nav">
        <a href="#"><i class="fas fa-th-large"></i></a>
        <a href="#" class="active"><i class="fas fa-calendar-alt"></i></a>
        <a href="#"><i class="fas fa-chart-pie"></i></a>
        <a href="#" onclick="confirmLogout()"><i class="fas fa-sign-out-alt text-danger"></i></a>
    </nav>

    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 glass-panel">
                <div class="modal-body p-4 p-md-5">
                    <h3 class="fw-800 mb-4" id="modalTitle">เพิ่มข้อมูลการจอง</h3>
                    <form id="bookingForm">
                        <input type="hidden" id="editId">
                        <div class="mb-4">
                            <label class="small fw-bold text-secondary mb-2 ms-2">ชื่อลูกค้า</label>
                            <input type="text" id="custName" class="form-control form-control-lg border-0 bg-light rounded-4 px-4 shadow-sm" required>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <label class="small fw-bold text-secondary mb-2 ms-2">วันที่</label>
                                <input type="date" id="bookDate" class="form-control border-0 bg-light rounded-4 shadow-sm" required>
                            </div>
                            <div class="col-6">
                                <label class="small fw-bold text-secondary mb-2 ms-2">เวลา</label>
                                <input type="time" id="bookTime" class="form-control border-0 bg-light rounded-4 shadow-sm" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="small fw-bold text-secondary mb-2 ms-2">บริการที่ต้องการ</label>
                            <textarea id="bookNote" class="form-control border-0 bg-light rounded-4 px-4 py-3 shadow-sm" rows="3"></textarea>
                        </div>
                        <div class="d-flex gap-3">
                            <button type="button" class="btn btn-light w-100 py-3 rounded-4 fw-bold" data-bs-dismiss="modal">ยกเลิก</button>
                            <button type="submit" class="btn btn-grad w-100 py-3 rounded-4 shadow-sm">บันทึกข้อมูล</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      
      
      
      
        const modal = new bootstrap.Modal(document.getElementById('bookingModal'));
        
        // --- ระบบ User เบื้องต้น ---
        // ในระบบจริง ชื่อนี้จะได้มาจาก Login Session
        let currentUser = sessionStorage.getItem('currentUser') || 'User_' + Math.floor(Math.random() * 1000);
        if(!sessionStorage.getItem('currentUser')) sessionStorage.setItem('currentUser', currentUser);
        
        document.getElementById('displayUser').innerText = currentUser;

        let bookings = JSON.parse(localStorage.getItem('allBookings') || '[]');

        window.onload = () => { renderTable(); };

        function renderTable() {
            const tbody = document.querySelector('#bookingTable tbody');
            tbody.innerHTML = '';
            
            let myCount = 0;
            bookings.forEach(item => {
                const isMine = item.createdBy === currentUser;
                if(isMine) myCount++;

                const tr = document.createElement('tr');
                tr.innerHTML = createRowHTML(item, isMine);
                tbody.appendChild(tr);
            });

            document.getElementById('totalQueue').innerText = bookings.length;
            document.getElementById('myQueueCount').innerText = myCount;
        }

        function createRowHTML(item, isMine) {
            const statusBadge = item.status === 'confirmed' 
                ? '<span class="badge-glass st-confirm"><i class="fas fa-check-circle"></i> ยืนยันแล้ว</span>'
                : '<span class="badge-glass st-pending"><i class="fas fa-clock"></i> รอดำเนินการ</span>';
            
            // ถ้าไม่ใช่ของตัวเอง จะใส่ Attribute disabled และซ่อนปุ่มตามความเหมาะสม
            const editBtn = `<button class="btn-action mx-1 shadow-sm" onclick="editBooking(${item.id})" ${!isMine ? 'disabled' : ''} style="color: #6366f1;"><i class="fas fa-pencil-alt"></i></button>`;
            const delBtn = `<button class="btn-action mx-1 shadow-sm" onclick="deleteBooking(${item.id})" ${!isMine ? 'disabled' : ''} style="color: #f43f5e;"><i class="fas fa-trash-alt"></i></button>`;
            
            return `
                <td>
                    <div class="fw-800 text-dark">${item.date}</div>
                    <div class="small text-primary fw-bold px-2 bg-primary bg-opacity-10 rounded-pill d-inline-block mt-1">${item.time} น.</div>
                </td>
                <td>
                    <div class="fw-800 text-dark">${item.name}</div>
                    <div class="small text-muted">${item.note}</div>
                    <span class="creator-tag">สร้างโดย: ${isMine ? 'คุณ' : item.createdBy}</span>
                </td>
                <td>${statusBadge}</td>
                <td class="text-center">
                    ${isMine ? editBtn + delBtn : '<span class="text-muted small">อ่านอย่างเดียว</span>'}
                </td>
            `;
        }

        function openAddModal() {
            document.getElementById('editId').value = '';
            document.getElementById('bookingForm').reset();
            document.getElementById('modalTitle').innerText = "เพิ่มข้อมูลการจอง";
            modal.show();
        }

        document.getElementById('bookingForm').onsubmit = function(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            
            if (id) {
                // กรณีแก้ไข: เช็คสิทธิ์ซ้ำอีกครั้งในฝั่ง Logic
                const index = bookings.findIndex(b => b.id == id);
                if (bookings[index].createdBy !== currentUser) {
                    Swal.fire('ผิดพลาด!', 'คุณไม่มีสิทธิ์แก้ไขรายการนี้', 'error');
                    return;
                }

                bookings[index] = {
                    ...bookings[index],
                    name: document.getElementById('custName').value,
                    note: document.getElementById('bookNote').value,
                    date: document.getElementById('bookDate').value,
                    time: document.getElementById('bookTime').value
                };
                Swal.fire({ icon: 'success', title: 'อัปเดตเรียบร้อย!', timer: 1500, showConfirmButton: false });
            } else {
                // เพิ่มข้อมูลใหม่: บันทึกว่าใครเป็นคนสร้าง
                const data = {
                    id: Date.now(),
                    name: document.getElementById('custName').value,
                    note: document.getElementById('bookNote').value,
                    date: document.getElementById('bookDate').value,
                    time: document.getElementById('bookTime').value,
                    status: 'pending',
                    createdBy: currentUser // เก็บชื่อผู้สร้าง
                };
                bookings.push(data);
                Swal.fire({ icon: 'success', title: 'จองสำเร็จ!', timer: 1500, showConfirmButton: false });
            }

            localStorage.setItem('allBookings', JSON.stringify(bookings));
            renderTable();
            modal.hide();
        };

        function editBooking(id) {
            const item = bookings.find(b => b.id == id);
            
            // เช็คสิทธิ์ก่อนเปิด Modal
            if (item.createdBy !== currentUser) {
                Swal.fire('ปฏิเสธการเข้าถึง', 'คุณสามารถแก้ไขรายการของตัวเองเท่านั้น', 'warning');
                return;
            }

            document.getElementById('editId').value = item.id;
            document.getElementById('custName').value = item.name;
            document.getElementById('bookNote').value = item.note;
            document.getElementById('bookDate').value = item.date;
            document.getElementById('bookTime').value = item.time;
            document.getElementById('modalTitle').innerText = "แก้ไขข้อมูลการจอง";
            modal.show();
        }

        function deleteBooking(id) {
            const item = bookings.find(b => b.id == id);
            
            if (item.createdBy !== currentUser) {
                Swal.fire('ผิดพลาด!', 'คุณไม่สามารถลบรายการของคนอื่นได้', 'error');
                return;
            }

            Swal.fire({
                title: 'ยืนยันการลบ?',
                text: "คุณต้องการลบรายการจองของคุณใช่หรือไม่?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ลบรายการ',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#f43f5e'
            }).then((result) => {
                if (result.isConfirmed) {
                    bookings = bookings.filter(b => b.id !== id);
                    localStorage.setItem('allBookings', JSON.stringify(bookings));
                    renderTable();
                    Swal.fire('ลบแล้ว!', '', 'success');
                }
            });
        }

        // แก้ไขโค้ดใน dashboard.html ส่วนฟังก์ชัน confirmLogout
function confirmLogout() {
    Swal.fire({
        title: 'ออกจากระบบ?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'ใช่',
        cancelButtonText: 'ยกเลิก'
    }).then((result) => { 
        if (result.isConfirmed) {
            sessionStorage.removeItem('currentUser'); // ลบข้อมูลการล็อกอิน
            window.location.href = 'login.html';     // ส่งกลับไปหน้าล็อกอิน
        } 
    });
}

    </script>
</body>
</html>
