<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dashboard | ระบบจองคิว</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --main-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --primary-soft: rgba(99, 102, 241, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body { font-family: 'Kanit', sans-serif; background: #f8fafc; min-height: 100vh; }

        .navbar { background: var(--glass-bg); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); padding: 15px 0; }

        .user-badge { background: var(--main-grad); color: white; padding: 5px 15px; border-radius: 50px; font-size: 0.9rem; }

        .btn-add {
            background: var(--main-grad); border: none; border-radius: 12px; padding: 12px 25px; color: white; font-weight: 600;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); transition: 0.3s;
        }
        .btn-add:hover { transform: scale(1.05); color: white; }

        .booking-table { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        .status-badge { border-radius: 50px; padding: 6px 12px; font-size: 0.8rem; font-weight: 500; }
    </style>
</head>
<body>

    <nav class="navbar sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand fw-bold text-dark fs-4">
                <i class="fas fa-calendar-check text-primary me-2"></i>MyBooking
            </span>
            <div class="d-flex align-items-center gap-3">
                <span class="user-badge"><i class="fas fa-user-circle me-2"></i>สวัสดีคุณ <span id="userName">...</span></span>
                <button class="btn btn-outline-danger btn-sm border-0" onclick="confirmLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row align-items-center mb-5">
            <div class="col-md-6">
                <h2 class="fw-bold animate__animated animate__fadeInLeft">รายการจองของคุณ</h2>
                <p class="text-muted">ติดตามสถานะหรือแจ้งจองใหม่ได้ทันที</p>
            </div>
            <div class="col-md-6 text-md-end">
                <button class="btn btn-add animate__animated animate__pulse animate__infinite" onclick="openBookingModal()">
                    <i class="fas fa-plus me-2"></i>จองคิวใหม่
                </button>
            </div>
        </div>

        <div class="booking-table animate__animated animate__fadeInUp">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">ลำดับ</th>
                            <th>รายการจอง</th>
                            <th>วันที่/เวลา</th>
                            <th>หมายเหตุ</th>
                            <th>สถานะ</th>
                            <th class="text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <form id="bookingForm">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="modalTitle">ลงทะเบียนจองคิว</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="bookId">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">รายการจอง / ชื่อลูกค้า</label>
                            <input type="text" id="custName" class="form-control rounded-3" required placeholder="เช่น ปฏิบัติธรรม / สนทนาธรรม">
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label small fw-bold">วันที่</label>
                                <input type="date" id="bookDate" class="form-control rounded-3" required>
                            </div>
                            <div class="col">
                                <label class="form-label small fw-bold">เวลา</label>
                                <input type="time" id="bookTime" class="form-control rounded-3" required>
                            </div>
                        </div>
                        <div class="mb-0">
                            <label class="form-label small fw-bold">หมายเหตุเพิ่มเติม</label>
                            <textarea id="bookNote" class="form-control rounded-3" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0 p-4">
                        <button type="button" class="btn btn-light rounded-3 px-4" data-bs-dismiss="modal">ยกเลิก</button>
                        <button type="submit" id="btnSubmit" class="btn btn-primary rounded-3 px-4">บันทึกข้อมูล</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    
    
<script>
    // --- CONFIG ---
    const TELEGRAM_TOKEN = '8449281474:AAG8jGiuNHPLVbmUJxnOWtLvl_wSiIAEbjc';
    const TELEGRAM_CHAT_ID = '-1003868893517'; 

    const currentUser = sessionStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'login.html';
    document.getElementById('userName').innerText = currentUser;

    const bookingModal = new bootstrap.Modal(document.getElementById('bookingModal'));

    function renderTable() {
        const allBookings = JSON.parse(localStorage.getItem('allBookings') || '[]');
        const myBookings = allBookings.filter(b => b.createdBy === currentUser);
        const tbody = document.getElementById('bookingTableBody');
        
        if (myBookings.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted">ยังไม่มีประวัติการจองของคุณ</td></tr>`;
            return;
        }

        tbody.innerHTML = myBookings.reverse().map((item, index) => `
            <tr>
                <td class="ps-4 text-secondary">${index + 1}</td>
                <td><div class="fw-bold">${item.name}</div></td>
                <td>
                    <div class="small fw-semibold"><i class="far fa-calendar me-1 text-primary"></i>${item.date}</div>
                    <div class="small text-muted"><i class="far fa-clock me-1 text-primary"></i>${item.time} น.</div>
                </td>
                <td><span class="text-muted small">${item.note || '-'}</span></td>
                <td>
                    <span class="status-badge ${item.status === 'confirmed' ? 'bg-success text-white' : 'bg-warning text-dark'}">
                        <i class="fas ${item.status === 'confirmed' ? 'fa-check-circle' : 'fa-clock'} me-1"></i>
                        ${item.status === 'confirmed' ? 'ยืนยันแล้ว' : 'รอตรวจสอบ'}
                    </span>
                </td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-info border-0 me-1" onclick="editBooking(${item.id})"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-sm btn-outline-danger border-0" onclick="deleteBooking(${item.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    document.getElementById('bookingForm').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        if(btn) btn.disabled = true;

        let allBookings = JSON.parse(localStorage.getItem('allBookings') || '[]');
        const id = document.getElementById('bookId').value;

        const bookingData = {
            id: id ? parseInt(id) : Date.now(),
            name: document.getElementById('custName').value,
            note: document.getElementById('bookNote').value,
            date: document.getElementById('bookDate').value,
            time: document.getElementById('bookTime').value,
            status: id ? allBookings.find(b => b.id == id).status : 'pending',
            createdBy: currentUser,
            createdAt: new Date().toISOString()
        };

        if (id) {
            const index = allBookings.findIndex(b => b.id == id);
            if (index !== -1) allBookings[index] = bookingData;
        } else {
            allBookings.push(bookingData);
            
            // ส่งแจ้งเตือน Telegram เมื่อมีการจองใหม่
            const message = `🙏 *มีการแจ้งจองใหม่!*\n` +
                            `📌 รายการ: ${bookingData.name}\n` +
                            `📅 วันที่: ${bookingData.date}\n` +
                            `⏰ เวลา: ${bookingData.time} น.\n` +
                            `👤 ผู้จอง: ${bookingData.createdBy}\n` +
                            `🔗 ตรวจสอบที่หน้า Admin ได้ทันที`;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
                });
            } catch (err) { console.error("Telegram Error", err); }
        }

        localStorage.setItem('allBookings', JSON.stringify(allBookings));
        bookingModal.hide();
        if(btn) btn.disabled = false;

        Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
        renderTable();
    };

    // ฟังก์ชันอื่นๆ (editBooking, deleteBooking, confirmLogout) ให้คงไว้ตามเดิม
</script>

</body>
</html>
