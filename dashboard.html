<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dashboard | Tattoo Booking</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --main-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --primary-soft: rgba(99, 102, 241, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* UI Components */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .btn-grad {
            background: var(--main-grad); color: white; border: none; 
            padding: 10px 24px; border-radius: 12px; font-weight: 600; transition: 0.3s;
        }
        .btn-grad:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(99, 102, 241, 0.3); color: white; }

        .badge-status {
            padding: 6px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 600;
        }
        .status-confirmed { background: #dcfce7; color: #166534; }
        .status-pending { background: #fef9c3; color: #854d0e; }

        .floating-nav {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: #1e293b; padding: 10px 25px; border-radius: 50px;
            display: flex; gap: 25px; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .floating-nav a { color: #94a3b8; font-size: 1.2rem; transition: 0.3s; cursor: pointer; }
        .floating-nav a:hover, .floating-nav a.active { color: #818cf8; }

        .empty-state { padding: 40px; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>

    <header class="container py-4">
        <div class="d-flex justify-content-between align-items-center">
            <div class="animate__animated animate__fadeIn">
                <h2 class="fw-bold mb-0" style="background: var(--main-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">TATTOO BOOKING</h2>
                <p class="text-muted small mb-0">สวัสดี, <span id="displayUser" class="fw-bold text-dark">...</span> 👋</p>
            </div>
            <button class="btn btn-grad animate__animated animate__bounceIn" onclick="openAddModal()">
                <i class="fas fa-plus me-2"></i> จองคิวใหม่
            </button>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="glass-panel p-3 text-center">
                    <div class="small text-muted">คิวทั้งหมด</div>
                    <div class="h4 fw-bold mb-0" id="totalQueue">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="glass-panel p-3 text-center">
                    <div class="small text-muted">คิวของฉัน</div>
                    <div class="h4 fw-bold mb-0 text-primary" id="myQueueCount">0</div>
                </div>
            </div>
        </div>

        <div class="glass-panel p-2 p-md-4">
            <div class="table-responsive">
                <table class="table table-borderless align-middle" id="bookingTable">
                    <thead class="text-muted small text-uppercase">
                        <tr>
                            <th>วันเวลา</th>
                            <th>รายละเอียด</th>
                            <th>สถานะ</th>
                            <th class="text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div id="emptyMsg" class="empty-state d-none">
                    <i class="fas fa-calendar-times fa-3x mb-3 opacity-20"></i>
                    <p>ยังไม่มีข้อมูลการจองในขณะนี้</p>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-panel border-0 shadow-lg">
                <div class="modal-body p-4">
                    <h4 class="fw-bold mb-4" id="modalTitle">จองคิวสัก</h4>
                    <form id="bookingForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="small fw-bold mb-1">ชื่อ-นามสกุล</label>
                            <input type="text" id="custName" class="form-control rounded-3" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="small fw-bold mb-1">วันที่</label>
                                <input type="date" id="bookDate" class="form-control rounded-3" required>
                            </div>
                            <div class="col-6">
                                <label class="small fw-bold mb-1">เวลา</label>
                                <input type="time" id="bookTime" class="form-control rounded-3" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="small fw-bold mb-1">รายละเอียดเพิ่มเติม</label>
                            <textarea id="bookNote" class="form-control rounded-3" rows="3" placeholder="ระบุตำแหน่งที่ต้องการสัก หรือขนาด..."></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-light w-100 fw-bold" data-bs-dismiss="modal">ยกเลิก</button>
                            <button type="submit" class="btn btn-grad w-100">บันทึกข้อมูล</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <nav class="floating-nav">
        <a class="active"><i class="fas fa-home"></i></a>
        <a><i class="fas fa-search"></i></a>
        <a onclick="confirmLogout()"><i class="fas fa-power-off text-danger"></i></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const modal = new bootstrap.Modal(document.getElementById('bookingModal'));
        const currentUser = sessionStorage.getItem('currentUser');

        // 🛡️ Security Check
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        document.getElementById('displayUser').innerText = currentUser;

        function renderTable() {
            const bookings = JSON.parse(localStorage.getItem('allBookings') || '[]');
            const tbody = document.getElementById('tableBody');
            const emptyMsg = document.getElementById('emptyMsg');
            
            tbody.innerHTML = '';
            
            if (bookings.length === 0) {
                emptyMsg.classList.remove('d-none');
                return;
            } else {
                emptyMsg.classList.add('d-none');
            }

            // เรียงข้อมูลล่าสุดขึ้นก่อน
            const sortedBookings = [...bookings].reverse();
            let myCount = 0;

            sortedBookings.forEach(item => {
                const isMine = item.createdBy === currentUser;
                if (isMine) myCount++;

                const tr = document.createElement('tr');
                tr.className = "animate__animated animate__fadeIn border-bottom border-light";
                tr.innerHTML = `
                    <td>
                        <div class="fw-bold">${item.date}</div>
                        <div class="small text-primary">${item.time} น.</div>
                    </td>
                    <td>
                        <div class="fw-bold text-dark">${item.name}</div>
                        <div class="small text-muted text-truncate" style="max-width: 150px;">${item.note || '-'}</div>
                        <div style="font-size: 0.7rem; color: #94a3b8;">โดย: ${isMine ? 'คุณ' : item.createdBy}</div>
                    </td>
                    <td>
                        <span class="badge-status ${item.status === 'confirmed' ? 'status-confirmed' : 'status-pending'}">
                            ${item.status === 'confirmed' ? 'ยืนยันแล้ว' : 'รอตรวจสอบ'}
                        </span>
                    </td>
                    <td class="text-center">
                        ${isMine ? `
                            <button class="btn btn-sm text-primary p-2" onclick="editBooking(${item.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm text-danger p-2" onclick="deleteBooking(${item.id})"><i class="fas fa-trash-alt"></i></button>
                        ` : '<i class="fas fa-lock text-muted opacity-50"></i>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalQueue').innerText = bookings.length;
            document.getElementById('myQueueCount').innerText = myCount;
        }

        // --- CRUD Operations ---

        function openAddModal() {
            document.getElementById('editId').value = '';
            document.getElementById('bookingForm').reset();
            document.getElementById('modalTitle').innerText = "เพิ่มข้อมูลการจอง";
            modal.show();
        }

        document.getElementById('bookingForm').onsubmit = function(e) {
            e.preventDefault();
            let allBookings = JSON.parse(localStorage.getItem('allBookings') || '[]');
            const id = document.getElementById('editId').value;

            if (id) {
                const idx = allBookings.findIndex(b => b.id == id);
                if (allBookings[idx].createdBy !== currentUser) return;
                
                allBookings[idx] = {
                    ...allBookings[idx],
                    name: document.getElementById('custName').value,
                    note: document.getElementById('bookNote').value,
                    date: document.getElementById('bookDate').value,
                    time: document.getElementById('bookTime').value
                };
            } else {
                allBookings.push({
                    id: Date.now(),
                    name: document.getElementById('custName').value,
                    note: document.getElementById('bookNote').value,
                    date: document.getElementById('bookDate').value,
                    time: document.getElementById('bookTime').value,
                    status: 'pending',
                    createdBy: currentUser
                });
            }

            localStorage.setItem('allBookings', JSON.stringify(allBookings));
            renderTable();
            modal.hide();
            Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', showConfirmButton: false, timer: 1000 });
        };

        function editBooking(id) {
            const bookings = JSON.parse(localStorage.getItem('allBookings') || '[]');
            const item = bookings.find(b => b.id == id);
            if (item.createdBy !== currentUser) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('custName').value = item.name;
            document.getElementById('bookNote').value = item.note;
            document.getElementById('bookDate').value = item.date;
            document.getElementById('bookTime').value = item.time;
            document.getElementById('modalTitle').innerText = "แก้ไขข้อมูล";
            modal.show();
        }

        function deleteBooking(id) {
            Swal.fire({
                title: 'ยืนยันการลบ?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f43f5e',
                confirmButtonText: 'ลบรายการ'
            }).then((res) => {
                if (res.isConfirmed) {
                    let all = JSON.parse(localStorage.getItem('allBookings') || '[]');
                    all = all.filter(b => b.id !== id);
                    localStorage.setItem('allBookings', JSON.stringify(all));
                    renderTable();
                }
            });
        }

        function confirmLogout() {
            Swal.fire({
                title: 'ออกจากระบบ?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ยืนยัน'
            }).then((res) => {
                if (res.isConfirmed) {
                    sessionStorage.clear();
                    window.location.href = 'login.html';
                }
            });
        }

        // 🔄 Sync Data (เช็คข้อมูลใหม่ทุก 3 วินาที กรณี Admin กด Approve)
        setInterval(renderTable, 3000);
        window.onload = renderTable;
    </script>
</body>
</html>
