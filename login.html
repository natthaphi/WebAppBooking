<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | MyBooking System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: var(--primary-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            padding: 45px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.1);
            border-color: #764ba2;
        }

        .btn-login {
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.4);
            color: white;
        }

        .register-link {
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card animate__animated animate__zoomIn">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h3 class="fw-bold text-dark">ยินดีต้อนรับ</h3>
            <p class="text-muted small">เข้าสู่ระบบเพื่อจัดการการจองของคุณ</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold">ชื่อผู้ใช้งาน</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px;">
                        <i class="far fa-user text-muted"></i>
                    </span>
                    <input type="text" id="username" class="form-control border-start-0" 
                           placeholder="Username" required style="border-radius: 0 12px 12px 0;">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">รหัสผ่าน</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px;">
                        <i class="fas fa-key text-muted"></i>
                    </span>
                    <input type="password" id="password" class="form-control border-start-0" 
                           placeholder="Password" required style="border-radius: 0 12px 12px 0;">
                </div>
            </div>

            <button type="submit" class="btn btn-login mb-3">
                เข้าสู่ระบบ <i class="fas fa-sign-in-alt ms-2"></i>
            </button>

            <div class="text-center mt-3">
                <p class="small text-muted">ยังไม่มีบัญชี? <a href="register.html" class="register-link">สมัครสมาชิกที่นี่</a></p>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // 🛡️ ป้องกันการกลับมาหน้า Login ถ้าล็อกอินอยู่แล้ว
        window.onload = () => {
            if (sessionStorage.getItem('currentUser')) {
                const role = sessionStorage.getItem('role');
                window.location.href = (role === 'admin') ? 'admin.html' : 'dashboard.html';
            }
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            // 1. ตรวจสอบสิทธิ์ Admin (ตั้งค่าไว้ตายตัว)
            if (user === 'admin' && pass === '123456') {
                sessionStorage.setItem('currentUser', 'Admin');
                sessionStorage.setItem('role', 'admin');
                
                showSuccessAndRedirect('admin.html', 'เข้าสู่ระบบในฐานะแอดมิน');
                return;
            }

            // 2. ตรวจสอบ User ทั่วไปจาก LocalStorage (ที่สมัครผ่าน register.html)
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const foundUser = users.find(u => u.username === user && u.password === pass);

            if (foundUser) {
                sessionStorage.setItem('currentUser', foundUser.username);
                sessionStorage.setItem('role', 'user');
                // เก็บข้อมูลอื่นๆ ที่จำเป็นถ้าต้องการ
                
                showSuccessAndRedirect('dashboard.html', 'เข้าสู่ระบบสำเร็จ');
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'ล็อกอินล้มเหลว',
                    text: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!',
                    confirmButtonColor: '#764ba2'
                });
            }
        });

        function showSuccessAndRedirect(targetPage, message) {
            Swal.fire({
                icon: 'success',
                title: message,
                showConfirmButton: false,
                timer: 1200,
                didOpen: () => {
                    Swal.showLoading();
                }
            }).then(() => {
                window.location.href = targetPage;
            });
        }
    </script>
</body>
</html>
