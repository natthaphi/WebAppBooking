<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Tattoo Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Kanit', sans-serif;
            background: var(--primary-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 5px;
        }
        .btn-login {
            background: var(--primary-gradient);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card animate__animated animate__fadeIn">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-dark">ยินดีต้อนรับ</h2>
        <p class="text-muted">ระบบจองคิวสักลาย</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">ชื่อผู้ใช้งาน</label>
            <input type="text" id="username" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">รหัสผ่าน</label>
            <input type="password" id="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-login mt-3">เข้าสู่ระบบ</button>
    </form>

    <div class="text-center mt-4">
        <span class="text-muted">ยังไม่มีบัญชี?</span> <a href="register.html" class="text-decoration-none fw-bold" style="color: #764ba2;">สมัครสมาชิก</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        // 1. ตรวจสอบกรณีเป็น Admin
        if (username === 'admin' && password === '123456') {
            sessionStorage.setItem('currentUser', 'admin');
            sessionStorage.setItem('role', 'admin'); // เก็บ Role ไว้เช็คสิทธิ์
            
            Swal.fire({
                icon: 'success',
                title: 'ยินดีต้อนรับผู้ดูแลระบบ',
                showConfirmButton: false,
                timer: 1000
            }).then(() => {
                window.location.href = 'admin.html'; // ส่งไปหน้า Admin
            });
            return;
        }

        // 2. ตรวจสอบ User ทั่วไปจาก LocalStorage
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const user = users.find(u => u.username === username && u.password === password);

        if (user) {
            sessionStorage.setItem('currentUser', username);
            sessionStorage.setItem('role', 'user');
            
            Swal.fire({
                icon: 'success',
                title: 'เข้าสู่ระบบสำเร็จ',
                text: 'สวัสดีคุณ ' + username,
                showConfirmButton: false,
                timer: 1000
            }).then(() => {
                window.location.href = 'dashboard.html'; // ส่งไปหน้า Dashboard ลูกค้า
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'เข้าสู่ระบบไม่สำเร็จ',
                text: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
                confirmButtonColor: '#764ba2'
            });
        }
    });

    // ป้องกันการกด Back กลับมาหน้า Login ถ้าล็อกอินอยู่แล้ว
    window.onload = () => {
        if (sessionStorage.getItem('currentUser')) {
            const role = sessionStorage.getItem('role');
            window.location.href = (role === 'admin') ? 'admin.html' : 'dashboard.html';
        }
    };
</script>

</body>
</html>
