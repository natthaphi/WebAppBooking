<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Web App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--primary-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.2);
            border-color: #764ba2;
        }
        .btn-login {
            background: var(--primary-gradient);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: 0.3s;
            color: white;
            width: 100%;
        }
        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            color: white;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .register-link a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-dark">ยินดีต้อนรับ</h2>
        <p class="text-muted">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">ชื่อผู้ใช้งาน</label>
            <input type="text" id="username" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">รหัสผ่าน</label>
            <input type="password" id="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-login mb-3">LOGIN</button>
    </form>

    <div class="register-link">
        ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิกที่นี่</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // ดึงข้อมูลผู้ใช้จาก LocalStorage
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        
        // ค้นหาผู้ใช้ (และรองรับ Admin เริ่มต้น)
        const user = users.find(u => u.username === username && u.password === password);

        // Mockup Admin login
        // แก้ไขโค้ดใน login.html ส่วน script
if (user || (username === 'admin' && password === '123456')) {
    // บันทึกชื่อผู้ใช้ที่ล็อกอินจริงลงใน Session
    sessionStorage.setItem('currentUser', username); 
    
    Swal.fire({
        icon: 'success',
        title: 'เข้าสู่ระบบสำเร็จ',
        showConfirmButton: false,
        timer: 1500
    }).then(() => {
        window.location.href = 'dashboard.html';
    });
    
}else {
            Swal.fire('เข้าสู่ระบบไม่สำเร็จ', 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
        }
    });
</script>


</body>
</html>
