<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | Tattoo Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Kanit', sans-serif; /* ปรับให้เข้ากับหน้า Dashboard */
            background: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .icon-box {
            width: 70px;
            height: 70px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.2);
        }
        .form-label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            margin-left: 5px;
        }
        .form-control {
            border-radius: 15px;
            padding: 12px 18px;
            border: 1px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.2);
            border-color: #764ba2;
            background: white;
        }
        .btn-register {
            background: var(--primary-gradient);
            border: none;
            border-radius: 15px;
            padding: 15px;
            font-weight: 600;
            color: white;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.2);
            opacity: 0.95;
            color: white;
        }
        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #64748b;
        }
        .login-link a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="header-text text-center mb-4">
        <div class="icon-box">
            <i class="fas fa-user-plus"></i>
        </div>
        <h2 class="fw-bold">สร้างบัญชีใหม่</h2>
        <p class="text-muted">เข้าร่วมเป็นส่วนหนึ่งกับระบบของเรา</p>
    </div>

    <form id="registerForm">
        <div class="mb-3">
            <label for="regUser" class="form-label">ชื่อผู้ใช้งาน (Username)</label>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0" style="border-radius: 15px 0 0 15px;">
                    <i class="fas fa-user text-muted"></i>
                </span>
                <input type="text" id="regUser" class="form-control border-start-0" style="border-radius: 0 15px 15px 0;" placeholder="ภาษาอังกฤษหรือตัวเลข" required>
            </div>
        </div>

        <div class="mb-4">
            <label for="regPass" class="form-label">รหัสผ่าน (Password)</label>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0" style="border-radius: 15px 0 0 15px;">
                    <i class="fas fa-lock text-muted"></i>
                </span>
                <input type="password" id="regPass" class="form-control border-start-0" style="border-radius: 0 15px 15px 0;" placeholder="อย่างน้อย 6 ตัวอักษร" required>
            </div>
        </div>

        <button type="submit" class="btn btn-register">
            <i class="fas fa-check-circle me-2"></i> ยืนยันสมัครสมาชิก
        </button>
    </form>

    <div class="login-link">
        มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบที่นี่</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const user = document.getElementById('regUser').value.trim();
        const pass = document.getElementById('regPass').value;

        // 1. ตรวจสอบความยาวรหัสผ่าน
        if (pass.length < 6) {
            Swal.fire({
                icon: 'error',
                title: 'ผิดพลาด',
                text: 'รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร',
                confirmButtonColor: '#6366f1'
            });
            return;
        }

        // 2. ดึงข้อมูลผู้ใช้จาก localStorage
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        
        // 3. ตรวจสอบชื่อผู้ใช้งานซ้ำ
        if (users.find(u => u.username.toLowerCase() === user.toLowerCase())) {
            Swal.fire({
                icon: 'warning',
                title: 'ไม่สามารถใช้ชื่อนี้ได้',
                text: 'ชื่อผู้ใช้งานนี้มีอยู่ในระบบแล้ว กรุณาใช้ชื่ออื่น',
                confirmButtonColor: '#6366f1'
            });
            return;
        }

        // 4. บันทึกผู้ใช้ใหม่พร้อมกำหนด Role เริ่มต้น
        users.push({ 
            username: user, 
            password: pass, 
            role: 'user' 
        });
        localStorage.setItem('users', JSON.stringify(users));

        // 5. แสดงผลสำเร็จและย้ายหน้า
        Swal.fire({
            icon: 'success',
            title: 'สมัครสมาชิกสำเร็จ!',
            text: 'ระบบกำลังนำคุณไปยังหน้าเข้าสู่ระบบ',
            timer: 2000,
            showConfirmButton: false,
            willClose: () => {
                window.location.href = 'login.html';
            }
        });
    });
</script>

</body>
</html>
