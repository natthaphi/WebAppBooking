<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | Tattoo Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Kanit', sans-serif;
            background: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .icon-box {
            width: 70px;
            height: 70px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.2);
        }
        .form-label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            margin-left: 5px;
        }
        .form-control {
            border-radius: 15px;
            padding: 12px 18px;
            border: 1px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.2);
            border-color: #764ba2;
            background: white;
        }
        .input-group-text {
            border-radius: 15px 0 0 15px !important;
            background-color: white;
            border-right: none;
            color: #94a3b8;
        }
        .form-control.with-icon {
            border-left: none;
            border-radius: 0 15px 15px 0 !important;
        }
        .btn-register {
            background: var(--primary-gradient);
            border: none;
            border-radius: 15px;
            padding: 15px;
            font-weight: 600;
            color: white;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.2);
            color: white;
        }
        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #64748b;
        }
        .login-link a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="header-text text-center mb-4">
        <div class="icon-box">
            <i class="fas fa-user-plus"></i>
        </div>
        <h2 class="fw-bold">สร้างบัญชีใหม่</h2>
        <p class="text-muted">กรอกข้อมูลเพื่อเข้าร่วมระบบจองคิว</p>
    </div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">ชื่อ-นามสกุลจริง</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                <input type="text" id="regFullname" class="form-control with-icon" placeholder="เช่น นายสมชาย ใจดี" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">เบอร์โทรศัพท์</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-phone"></i></span>
                <input type="tel" id="regPhone" class="form-control with-icon" placeholder="08XXXXXXXX" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">ชื่อผู้ใช้งาน (Username)</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" id="regUser" class="form-control with-icon" placeholder="ภาษาอังกฤษหรือตัวเลข" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">รหัสผ่าน (Password)</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="regPass" class="form-control with-icon" placeholder="อย่างน้อย 6 ตัวอักษร" required>
            </div>
        </div>

        <button type="submit" class="btn btn-register shadow-sm">
            <i class="fas fa-check-circle me-2"></i> ยืนยันสมัครสมาชิก
        </button>
    </form>

    <div class="login-link">
        มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบที่นี่</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('regUser').value.trim();
        const pass = document.getElementById('regPass').value;
        const fullname = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();

        if (pass.length < 6) {
            Swal.fire({ icon: 'warning', title: 'รหัสผ่านสั้นเกินไป', text: 'ต้องมี 6 ตัวอักษรขึ้นไป' });
            return;
        }

        const users = JSON.parse(localStorage.getItem('users') || '[]');
        if (users.some(u => u.username.toLowerCase() === user.toLowerCase())) {
            Swal.fire({ icon: 'error', title: 'ชื่อผู้ใช้นี้มีผู้ใช้แล้ว' });
            return;
        }

        // เก็บข้อมูล User ลง LocalStorage
        users.push({ 
            username: user, 
            password: pass, 
            fullname: fullname, 
            phone: phone, 
            role: 'user' 
        });
        localStorage.setItem('users', JSON.stringify(users));

        Swal.fire({ icon: 'success', title: 'สมัครสำเร็จ', showConfirmButton: false, timer: 1500 })
            .then(() => window.location.href = 'login.html');
    });
</script>



<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        // รับค่าจากฟอร์ม
        const fullname = document.getElementById('regFullname').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const user = document.getElementById('regUser').value.trim();
        const pass = document.getElementById('regPass').value;

        // 1. ตรวจสอบความยาวรหัสผ่าน
        if (pass.length < 6) {
            Swal.fire({
                icon: 'error',
                title: 'รหัสผ่านสั้นเกินไป',
                text: 'กรุณาตั้งรหัสผ่านอย่างน้อย 6 ตัวอักษร',
                confirmButtonColor: '#764ba2'
            });
            return;
        }

        // 2. ดึงข้อมูลผู้ใช้เดิมจาก LocalStorage
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        
        // 3. ตรวจสอบ Username ซ้ำ (Case-insensitive)
        const isDuplicate = users.some(u => u.username.toLowerCase() === user.toLowerCase());
        if (isDuplicate) {
            Swal.fire({
                icon: 'warning',
                title: 'ชื่อผู้ใช้งานนี้ถูกใช้แล้ว',
                text: 'กรุณาเลือกชื่อผู้ใช้งานอื่น',
                confirmButtonColor: '#764ba2'
            });
            return;
        }

        // 4. บันทึกข้อมูลใหม่ลงใน LocalStorage
        const newUser = { 
            username: user, 
            password: pass, 
            fullname: fullname,
            phone: phone,
            role: 'user',
            registeredAt: new Date().toLocaleString('th-TH')
        };
        
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));

        // 5. แจ้งผลสำเร็จและย้ายหน้า
        Swal.fire({
            icon: 'success',
            title: 'สมัครสมาชิกสำเร็จ!',
            text: 'ยินดีต้อนรับคุณ ' + fullname,
            timer: 2000,
            showConfirmButton: false,
            willClose: () => {
                window.location.href = 'login.html';
            }
        });
    });
</script>

</body>
</html>
