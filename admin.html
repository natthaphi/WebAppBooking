<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Admin | ระบบจัดการการจอง</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary: #6366f1; 
            --sidebar-dark: #1e293b;
            --bg-body: #f8fafc;
        }
        body { font-family: 'Plus Jakarta Sans', 'Kanit', sans-serif; background-color: var(--bg-body); margin: 0; }
        .sidebar {
            width: 260px; height: 100vh; background: var(--sidebar-dark);
            position: fixed; color: white; padding: 20px;
        }
        .main-content { margin-left: 260px; padding: 40px; }
        .nav-link-custom {
            color: #94a3b8; padding: 12px 15px; border-radius: 10px;
            display: block; text-decoration: none; transition: 0.3s; margin-bottom: 5px;
        }
        .nav-link-custom:hover, .nav-link-custom.active {
            background: rgba(255,255,255,0.1); color: white;
        }
        .stat-card {
            background: white; border-radius: 20px; padding: 25px;
            border: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .table-container {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .badge-status { border-radius: 50px; padding: 5px 12px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h4 class="fw-bold mb-4 text-center text-primary">ADMIN PANEL</h4>
        <hr class="opacity-25">
        <a href="#" class="nav-link-custom active"><i class="fa fa-home me-2"></i> แดชบอร์ด</a>
        <a href="#" class="nav-link-custom"><i class="fa fa-calendar-alt me-2"></i> รายการจองทั้งหมด</a>
        <div style="position: absolute; bottom: 20px; width: 220px;">
            <button onclick="logout()" class="btn btn-outline-danger w-100 rounded-3">
                <i class="fa fa-sign-out-alt me-2"></i> ออกจากระบบ
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">ภาพรวมระบบ <small class="text-muted fs-6">Management Overview</small></h3>
            <div id="liveTime" class="text-muted"></div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="stat-card">
                    <small class="text-muted">รายการจองทั้งหมด</small>
                    <h2 class="fw-bold mb-0" id="totalBookings">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <small class="text-muted">รอตรวจสอบ</small>
                    <h2 class="fw-bold mb-0 text-warning" id="pendingBookings">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <small class="text-muted">ยืนยันแล้ว</small>
                    <h2 class="fw-bold mb-0 text-success" id="confirmedBookings">0</h2>
                </div>
            </div>
        </div>

        <div class="table-container animate__animated animate__fadeIn">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold mb-0"><i class="fa fa-list me-2"></i>รายการคำขอจองล่าสุด</h5>
                <button onclick="renderAdminTable()" class="btn btn-sm btn-light"><i class="fa fa-sync"></i> รีเฟรช</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ลำดับ</th>
                            <th>ข้อมูลจอง</th>
                            <th>ผู้จอง</th>
                            <th>วัน-เวลา</th>
                            <th>สถานะ</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    // --- 1. SECURITY & CONFIG ---
    // ตรวจสอบสถานะ Login (ถ้าใช้ระบบ session)
    // if (!sessionStorage.getItem('isLoggedIn')) { window.location.href = 'login.html'; }

    const TELEGRAM_TOKEN = '8449281474:AAG8jGiuNHPLVbmUJxnOWtLvl_wSiIAEbjc';
    const TELEGRAM_CHAT_ID = '-1003868893517';

    const DB = {
        getBookings: () => JSON.parse(localStorage.getItem('allBookings') || '[]'),
        saveBookings: (data) => localStorage.setItem('allBookings', JSON.stringify(data)),
        getCustomer: (username) => {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            return users.find(u => u.username === username) || { fullname: username, phone: "-" };
        }
    };

    // --- 2. RENDER FUNCTION ---
    function renderAdminTable() {
        const bookings = DB.getBookings();
        const tbody = document.getElementById('adminTableBody');
        
        document.getElementById('totalBookings').innerText = bookings.length;
        document.getElementById('pendingBookings').innerText = bookings.filter(b => b.status === 'pending').length;
        document.getElementById('confirmedBookings').innerText = bookings.filter(b => b.status === 'confirmed').length;

        if (bookings.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4">ไม่มีรายการข้อมูล</td></tr>`;
            return;
        }

        tbody.innerHTML = [...bookings].reverse().map((item, index) => {
            const customer = DB.getCustomer(item.createdBy);
            return `
                <tr>
                    <td>${index + 1}</td>
                    <td>
                        <div class="fw-bold">${item.name}</div>
                        <small class="text-muted">ID: ${item.id}</small>
                    </td>
                    <td>
                        <div>${customer.fullname}</div>
                        <small class="text-muted">${customer.phone}</small>
                    </td>
                    <td>${item.date}<br><small>${item.time} น.</small></td>
                    <td>
                        <span class="badge badge-status ${item.status === 'confirmed' ? 'bg-success' : 'bg-warning text-dark'}">
                            ${item.status === 'confirmed' ? 'ยืนยันแล้ว' : 'รอตรวจสอบ'}
                        </span>
                    </td>
                    <td>
                        <div class="btn-group">
                            ${item.status === 'pending' ? 
                                `<button class="btn btn-sm btn-success" onclick="updateStatus(${item.id}, 'confirmed')">อนุมัติ</button>` : 
                                `<button class="btn btn-sm btn-secondary" disabled>เรียบร้อย</button>`
                            }
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteBooking(${item.id})"><i class="fa fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // --- 3. ACTIONS ---
    async function updateStatus(id, newStatus) {
        let bookings = DB.getBookings();
        const index = bookings.findIndex(b => b.id === id);
        
        if (index !== -1) {
            const item = bookings[index];
            const customer = DB.getCustomer(item.createdBy);
            
            bookings[index].status = newStatus;
            DB.saveBookings(bookings);

            // แจ้งเตือน Telegram
            const message = `✅ *ยืนยันการจองเรียบร้อย*\n` +
                            `📋 รายการ: ${item.name}\n` +
                            `👤 ผู้จอง: ${customer.fullname}\n` +
                            `📅 วันที่: ${item.date}\n` +
                            `⏰ เวลา: ${item.time} น.\n` +
                            `Admin ได้ทำการตรวจสอบและยืนยันแล้วครับ`;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: TELEGRAM_CHAT_ID, 
                        text: message, 
                        parse_mode: 'Markdown' 
                    })
                });
            } catch (e) { console.error("Error sending Telegram", e); }

            Swal.fire({ icon: 'success', title: 'ยืนยันเรียบร้อย', timer: 1500, showConfirmButton: false });
            renderAdminTable();
        }
    }

    function deleteBooking(id) {
        Swal.fire({
            title: 'ลบรายการนี้?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'ลบ',
            cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                let bookings = DB.getBookings().filter(b => b.id !== id);
                DB.saveBookings(bookings);
                renderAdminTable();
            }
        });
    }

    // --- 4. LOGOUT FUNCTION ---
    function logout() {
        Swal.fire({
            title: 'ยืนยันการออกจากระบบ?',
            text: "คุณจะต้องเข้าสู่ระบบใหม่อีกครั้ง",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#6366f1',
            cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ใช่, ออกจากระบบ',
            cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                // หากมีการเก็บข้อมูล session ให้เคลียร์ที่นี่
                sessionStorage.clear(); 
                localStorage.removeItem('isLoggedIn'); // ตัวอย่างการลบสถานะ Login
                
                window.location.href = 'login.html';
            }
        });
    }

    window.onload = renderAdminTable;
</script>
</body>
</html>
