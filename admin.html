<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Admin | Telegram Notification System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        :root {
            --primary: #0088cc; /* Telegram Blue */
            --sidebar-dark: #17212b;
            --bg-body: #f4f7f9;
        }

        body { font-family: 'Plus Jakarta Sans', 'Kanit', sans-serif; background-color: var(--bg-body); overflow-x: hidden; }

        /* Sidebar System */
        .sidebar {
            width: 280px; height: calc(100vh - 40px);
            background: var(--sidebar-dark);
            position: fixed; top: 20px; left: 20px;
            z-index: 1050; border-radius: 28px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .sidebar.collapsed { left: -320px; }
        .main-content { margin-left: 320px; padding: 2.5rem; transition: all 0.5s ease; }
        .main-content.expanded { margin-left: 20px; }

        .toggle-btn {
            position: fixed; left: 295px; top: 50px; z-index: 1100;
            background: var(--primary); color: white; border: none;
            width: 35px; height: 35px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.5s;
        }
        .sidebar.collapsed + .toggle-btn { left: 20px; transform: rotate(180deg); }

        .glass-card { background: white; border-radius: 30px; padding: 25px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .nav-link { color: #94a3b8; padding: 12px 20px; border-radius: 15px; text-decoration: none; display: block; margin: 8px 15px; cursor: pointer; transition: 0.3s; }
        .nav-link:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(0,136,204,0.3); }

        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.5s; }

        @media (max-width: 991px) {
            .sidebar { left: -320px; top: 0; height: 100vh; border-radius: 0; }
            .sidebar.active { left: 0; }
            .main-content { margin-left: 0; padding: 15px; }
            .toggle-btn { display: none; }
        }
    </style>
</head>
<body>

<div class="d-flex">
    <nav class="sidebar" id="sidebar">
        <div class="p-4 text-white text-center">
            <h4 class="fw-bold"><i class="fab fa-telegram me-2"></i> Admin Panel</h4>
        </div>
        <div class="mt-3">
            <a class="nav-link active" id="link-dashboard" onclick="showPage('dashboard')"><i class="fas fa-chart-line me-2"></i> ภาพรวมคิว</a>
            <a class="nav-link" id="link-booking" onclick="showPage('booking')"><i class="fas fa-list me-2"></i> รายชื่อลูกค้า</a>
        </div>
    </nav>

    <button class="toggle-btn shadow" onclick="toggleSidebar()" id="btnToggle"><i class="fas fa-chevron-left"></i></button>

    <div class="main-content w-100" id="mainContent">
        <header class="mb-4 d-flex justify-content-between align-items-center">
            <h2 class="fw-bold" id="pageTitle">ภาพรวมคิว</h2>
            <div id="connectionStatus"><span class="badge bg-success rounded-pill px-3 py-2"><i class="fas fa-circle me-1 small"></i> Telegram Bot Ready</span></div>
        </header>

        <section id="dashboard" class="page-section active">
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <div class="glass-card">
                        <small class="text-muted fw-bold">คิวทั้งหมดในระบบ</small>
                        <h1 class="display-4 fw-bold mb-0" id="totalCount">0</h1>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="glass-card">
                        <small class="text-muted fw-bold">รอยืนยัน</small>
                        <h1 class="display-4 fw-bold mb-0 text-warning" id="pendingCount">0</h1>
                    </div>
                </div>
            </div>
            <div class="glass-card">
                <h5 class="fw-bold mb-4">สถิติสัปดาห์นี้</h5>
                <div style="height: 300px;"><canvas id="bookingChart"></canvas></div>
            </div>
        </section>

        <section id="booking" class="page-section">
            <div class="glass-card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID ลูกค้า</th>
                                <th>ชื่อลูกค้า</th>
                                <th>วัน-เวลา</th>
                                <th>สถานะ</th>
                                <th class="text-end">การจัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // ---------------------------------------------------------
    // 1. CONFIG: ใส่ข้อมูล Telegram ของคุณที่นี่
    // ---------------------------------------------------------
    const TELEGRAM_TOKEN = '8449281474:AAG8jGiuNHPLVbmUJxnOWtLvl_wSiIAEbjc';         // ใส่_TOKEN_ของ_BOT_ตรงนี้
    const TELEGRAM_CHAT_ID = '8449281474';      // ใส่_CHAT_ID_ของคุณตรงนี้

    async function sendTelegramMessage(booking) {
        if (!TELEGRAM_TOKEN || TELEGRAM_TOKEN.includes('ใส่_TOKEN')) return;

        const text = `🔔 *มีการจองใหม่เข้ามา!*\n` +
                     `━━━━━━━━━━━━━━━\n` +
                     `🆔 *ID:* #${booking.id.toString().slice(-4)}\n` +
                     `👤 *ลูกค้า:* ${booking.name}\n` +
                     `📅 *วันที่:* ${booking.date}\n` +
                     `⏰ *เวลา:* ${booking.time} น.\n` +
                     `📝 *โน้ต:* ${booking.note || '-'}\n` +
                     `━━━━━━━━━━━━━━━`;

        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            });
        } catch (err) { console.error("Telegram Error:", err); }
    }

    // ---------------------------------------------------------
    // 2. REAL-TIME WATCHER
    // ---------------------------------------------------------
    let currentCount = JSON.parse(localStorage.getItem('allBookings') || '[]').length;

    function watchForNewBookings() {
        setInterval(() => {
            const bookings = JSON.parse(localStorage.getItem('allBookings') || '[]');
            if (bookings.length > currentCount) {
                const latest = bookings[bookings.length - 1];
                
                // แจ้งเตือนในหน้าเว็บ
                Swal.fire({
                    title: '🔔 คิวใหม่!',
                    text: `คุณ ${latest.name} ได้จองเข้ามาแล้ว`,
                    icon: 'info',
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 5000
                });

                // ส่งเข้า Telegram
                sendTelegramMessage(latest);

                currentCount = bookings.length;
                loadBookings();
            } else if (bookings.length < currentCount) {
                currentCount = bookings.length;
                loadBookings();
            }
        }, 3000);
    }

    // ---------------------------------------------------------
    // 3. UI LOGIC
    // ---------------------------------------------------------
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        sidebar.classList.toggle('collapsed');
        sidebar.classList.toggle('active'); // สำหรับ Mobile
        mainContent.classList.toggle('expanded');
    }

    function showPage(pageId) {
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('link-' + pageId).classList.add('active');
        document.getElementById('pageTitle').innerText = (pageId === 'dashboard') ? 'ภาพรวมคิว' : 'รายชื่อลูกค้า';
        if(window.innerWidth < 991) toggleSidebar();
        loadBookings();
    }

    function loadBookings() {
        const bookings = JSON.parse(localStorage.getItem('allBookings') || '[]');
        document.getElementById('totalCount').innerText = bookings.length;
        document.getElementById('pendingCount').innerText = bookings.filter(b => b.status !== 'confirmed').length;

        const tbody = document.getElementById('adminTableBody');
        if (bookings.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">ไม่พบข้อมูลการจอง</td></tr>';
            return;
        }

        tbody.innerHTML = [...bookings].reverse().map(b => `
            <tr class="animate__animated animate__fadeIn">
                <td><span class="badge bg-secondary-subtle text-secondary">#${b.id.toString().slice(-4)}</span></td>
                <td><b>${b.name}</b></td>
                <td>${b.date}<br><small class="text-primary">${b.time} น.</small></td>
                <td><span class="badge ${b.status === 'confirmed' ? 'bg-success' : 'bg-warning'}">${b.status === 'confirmed' ? 'ยืนยันแล้ว' : 'รอดำเนินการ'}</span></td>
                <td class="text-end">
                    <button class="btn btn-sm text-danger" onclick="deleteItem(${b.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    function deleteItem(id) {
        Swal.fire({ title: 'ลบรายการ?', text: 'ข้อมูลนี้จะหายไปจากระบบ', icon: 'warning', showCancelButton: true }).then(res => {
            if (res.isConfirmed) {
                let bookings = JSON.parse(localStorage.getItem('allBookings') || '[]');
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('allBookings', JSON.stringify(bookings));
                loadBookings();
            }
        });
    }

    // ---------------------------------------------------------
    // 4. CHART INIT
    // ---------------------------------------------------------
    window.onload = () => {
        loadBookings();
        watchForNewBookings();
        const ctx = document.getElementById('bookingChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.', 'อา.'],
                datasets: [{
                    label: 'ยอดจอง',
                    data: [10, 22, 15, 25, 30, 45, 38],
                    borderColor: '#0088cc',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(0, 136, 204, 0.05)'
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    };
</script>
</body>
</html>
