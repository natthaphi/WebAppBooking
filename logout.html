<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out... | Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: #0f172a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 0;
        }
        .loader-container { text-align: center; }
        .spinner-border { width: 3rem; height: 3rem; color: #6366f1; }
    </style>
</head>
<body>

<div class="loader-container">
    <div class="spinner-border mb-3" role="status"></div>
    <h4 class="fw-light">กำลังออกจากระบบอย่างปลอดภัย...</h4>
</div>

<script>
    // จำลองการเคลียร์ข้อมูล และหน่วงเวลาเพื่อให้ User รู้สึกว่าระบบกำลังจัดการ Log
    setTimeout(async () => {
        
        // 1. เคลียร์ LocalStorage หรือ Session (ถ้ามีการเก็บ Token ไว้)
        localStorage.clear();
        sessionStorage.clear();

        // 2. ถ้ามี API Backend สำหรับ Logout สามารถเรียกใช้ตรงนี้ได้
        // await fetch('/api/auth/logout', { method: 'POST' });

        // 3. ส่งกลับไปหน้า index.html หรือ login.html
        window.location.href = 'index.html';
        
    }, 1500); // หน่วงเวลา 1.5 วินาที
</script>

</body>
</html>
